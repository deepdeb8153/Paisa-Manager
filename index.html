<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1f"><link rel="manifest" href="manifest.webmanifest">
<title>Paisa Manager</title>
<style>
:root{--nb:rgba(22,20,52,.6);--bg:#0b0a1f;--c:#161434;--c2:#201d48;--bd:#2f2b63;--tx:#f2f0ff;--mu:#9a96c7;--ac:#8b5cf6;--in:#34d399;--ex:#fb5c8a;--sv:#60a5fa;color-scheme:dark}
[data-t=light]{--nb:rgba(255,255,255,.65);--bg:#f3f2fb;--c:#fff;--c2:#ece9fb;--bd:#dcd8f3;--tx:#1a1740;--mu:#6b678f;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 'Avenir Next','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#app{max-width:640px;margin:0 auto;padding:calc(62px + env(safe-area-inset-top)) 14px 0}
h1{font-size:26px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{margin:0 0 10px}small{color:var(--mu)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#3b1d8f,#1a1445 70%);border-color:#5b3bd1;color:#f2f0ff}
.hero small{color:#c4bdf0}.big{font-size:34px;font-weight:800;color:var(--in);letter-spacing:-.5px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd .g{flex:1}
.ib{width:42px;height:42px;border-radius:14px;background:var(--c);border:1px solid var(--bd);color:var(--tx);font-size:18px}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.grid3 .card{margin:0;padding:12px}.grid3 b{display:block;font-size:15px;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;margin-top:10px;background:var(--ac);color:#fff;font:600 15px inherit;cursor:pointer;text-align:center}
.btn.ghost{background:var(--c2);color:var(--tx)}.btn.red{background:var(--ex)}.btn.in{background:#10a37a}.btn.sm{padding:8px;margin:0;font-size:13px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit;margin-top:4px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mu)}input[type=checkbox]{width:auto;margin:0}
.seg{display:flex;background:var(--c2);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:11px;font:600 13px inherit}
.seg button.on{background:var(--ac);color:#fff}
.tr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.tr:last-child{border:0}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--c2);flex:none}
.mid{flex:1;min-width:0}.mid b,.mid small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{font-weight:700}.am.in{color:var(--in)}.am.ex{color:var(--ex)}
.mini{border:0;background:var(--c2);color:var(--tx);border-radius:9px;padding:5px 8px;font-size:13px;margin-left:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.bar{height:8px;background:var(--c2);border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:8px}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px;overflow-x:auto}
.bc{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bb{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end}.bb i{flex:1;border-radius:5px 5px 0 0;min-height:2px}
.bc span{font-size:10px;color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none}
.ban{height:150px;border-radius:16px;background:linear-gradient(120deg,#6d3df2,#ec4899) center/cover}
.chat{height:calc(100dvh - 300px);min-height:300px;overflow-y:auto;scroll-behavior:smooth;padding:6px 2px}
.sep{text-align:center;margin:14px 0 8px}.sep span{background:var(--c2);color:var(--mu);font-size:12px;padding:3px 12px;border-radius:12px}
.bub{max-width:78%;padding:10px 12px;border-radius:18px;margin:6px 0;position:relative}
.bub.in{background:rgba(52,211,153,.15);border:1px solid var(--in);border-bottom-left-radius:4px;margin-right:auto}
.bub.ex{background:rgba(139,92,246,.22);border:1px solid var(--ac);border-bottom-right-radius:4px;margin-left:auto}
.bub.tr{background:var(--c2);margin:6px auto;text-align:center}
.bub b{font-size:17px}.bub small{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nb);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:4px}nav button span{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#8b5cf6,#6d3df2);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(109,61,242,.5);z-index:6}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;align-items:flex-end;justify-content:center}
#sh{background:var(--c);width:100%;max-width:640px;max-height:calc(100dvh - 60px - env(safe-area-inset-top));overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(96px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#222;color:#fff;padding:9px 15px;border-radius:18px;font-size:13px;z-index:20;max-width:90%;display:none}
.empty{text-align:center;color:var(--mu);padding:24px}.avg{display:flex;flex-wrap:wrap;gap:6px}.avg button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--c2);font-size:24px}.avg button.on{border-color:var(--ac)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:var(--tx)}
.note{font-size:12px;color:var(--mu);margin-top:8px}.tg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
#nb{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:616px;margin:0 auto;background:var(--c);color:var(--tx);border:1px solid var(--ac);border-radius:16px;padding:12px 14px;z-index:30;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:dn .25s ease}@keyframes dn{from{transform:translateY(-30px);opacity:0}}
#tb{position:fixed;top:0;left:0;right:0;z-index:40;padding:env(safe-area-inset-top) 12px 0;height:calc(46px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:.3px;background:var(--nb);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
#mb{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 4px);width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--tx);font-size:24px;line-height:1}
#dr{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0);visibility:hidden;transition:background .25s,visibility .25s}
#dr.on{background:rgba(0,0,0,.55);visibility:visible}
#dp{position:absolute;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--c);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s ease;padding:calc(22px + env(safe-area-inset-top)) 16px 20px;overflow-y:auto}
#dr.on #dp{transform:none}
.dm{display:flex;align-items:center;gap:12px;padding:15px 6px;border-bottom:1px solid var(--bd);font-size:16px;cursor:pointer}.dm span{font-size:20px}
</style></head><body>
<div id="tb"><button id="mb" onclick="drawer(1)" aria-label="Menu">☰</button>Paisa Manager</div><div id="app"></div>
<button id="fab" onclick="tf()" aria-label="Add transaction">+</button>
<nav><button data-v="home" onclick="go('home')"><span>🏠</span>Home</button><button data-v="tx" onclick="go('tx')"><span>🧾</span>Transactions</button><button data-v="an" onclick="go('an')"><span>📊</span>Analytics</button><button data-v="pf" onclick="go('pf')"><span>👤</span>Profiles</button><button data-v="more" onclick="go('more')"><span>⚙️</span>More</button></nav>
<div id="ov" onclick="if(event.target===this)shut()"><div id="sh"></div></div><div id="toast"></div><div id="dr" onclick="if(event.target===this)drawer(0)"><div id="dp"><div style="font-size:20px;font-weight:800">💰 Paisa Manager</div><small>Manage your money</small><div style="margin-top:14px"><div class="dm" onclick="menu(privForm)"><span>🔒</span>Privacy Policy</div><div class="dm" onclick="menu(contactForm)"><span>✉️</span>Contact us</div><div class="dm" onclick="menu(rateForm)"><span>⭐</span>Rate the app</div></div><button class="btn ghost" style="margin-top:22px" onclick="drawer(0)">Close</button></div></div><div id="nb" onclick="this.style.display='none';notifCenter()"></div>
<script>
'use strict';
const K='pm_v1',$=s=>document.querySelector(s);let S,view='home',mode='list',IMG={},F,PE,AP='m',FL={q:'',c:'',a:'',f:'',t:''};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3),pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),tm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const COL=['#8b5cf6','#ec4899','#3b82f6','#22c55e','#f59e0b','#94a3b8','#14b8a6','#ef4444'];
const EM={Food:'🍔',Rent:'🏠',EMI:'🏦','Credit Card Bill':'💳',Friend:'🤝',Travel:'✈️','Udhaar Diya':'🤲',Transport:'🚌',Shopping:'🛍️',Bills:'🧾',Health:'💊',Salary:'💼',Bonus:'🎁'};
const emo=t=>t.type==='tr'?'🔁':EM[t.cat]||(t.type==='in'?'💰':'🏷️');
function np(id,n){return{id,name:n,av:'🙂',bg:'theme',acc:[{id:'a1',n:'Cash',s:0},{id:'a2',n:'Bank',s:0},{id:'a3',n:'UPI / Online',s:0},{id:'a4',n:'Credit Card',s:0}],ce:['Food','Rent','EMI','Credit Card Bill','Friend','Travel','Udhaar Diya','Transport','Shopping','Bills','Health','Other'],ci:['Salary','Kisi ne diya','Udhaar wapas mila','Bonus','Other'],tx:[],bud:{},lim:0}}
function load(){let raw=null;try{raw=localStorage.getItem(K);S=JSON.parse(raw)}catch(e){S=null;if(raw)try{localStorage.setItem(K+'_corrupt_backup',raw)}catch(x){}}
if(!S||!Array.isArray(S.p)||!S.p.length)S={a:'p1',p:[np('p1','Personal')]};
S.th=S.th==='light'?'light':'dark';S.n=Object.assign({tx:1,daily:1,dailyT:'21:00',budget:1,over:1,cat:1,lastDaily:'',lastBud:''},S.n||{});S.rem=S.rem||[];S.nl=S.nl||[];
delete S.sh;delete S.q;
S.p.forEach(p=>{p.av=p.av||'🙂';p.bg=(!p.bg||p.bg==='#ede9fe')?'theme':p.bg;p.tx=p.tx||[];p.bud=p.bud||{};p.lim=+p.lim||0;p.acc=p.acc||[];p.ce=p.ce||[];p.ci=p.ci||[];p.tx.forEach(t=>{t.time=t.time||'00:00';t.amt=+t.amt||0})});
if(!S.p.some(p=>p.id===S.a))S.a=S.p[0].id}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full or blocked – data not saved!')}}
const P=()=>S.p.find(p=>p.id===S.a)||S.p[0];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function open(h){$('#sh').innerHTML=h;$('#ov').style.display='flex'}function shut(){$('#ov').style.display='none'}
// ---- IndexedDB for images
let db;const idb=()=>db||(db=new Promise((ok,no)=>{try{const r=indexedDB.open('mm',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
const dbx=(m,fn)=>idb().then(d=>new Promise((ok,no)=>{const t=d.transaction('img',m),q=fn(t.objectStore('img'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}));
const tmo=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||2500))]);
const b2u=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
const LSI='pm_img_';
async function iput(k,v){try{await tmo(dbx('readwrite',s=>s.put(v,k)));try{localStorage.removeItem(LSI+k)}catch(e){}return}catch(e){}const u=await b2u(v);localStorage.setItem(LSI+k,u)}
async function iget(k){try{const b=await tmo(dbx('readonly',s=>s.get(k)));if(b)return b}catch(e){}try{const u=localStorage.getItem(LSI+k);return u?u2b(u):null}catch(e){return null}}
async function idel(k){try{await tmo(dbx('readwrite',s=>s.delete(k)))}catch(e){}try{localStorage.removeItem(LSI+k)}catch(e){}}
async function loadImgs(){for(const p of S.p)for(const k of['pic:','ban:']){try{const b=await iget(k+p.id);if(b)IMG[k+p.id]=URL.createObjectURL(b)}catch(e){}}try{const b=await iget('bg:app');if(b)IMG['bg:app']=URL.createObjectURL(b)}catch(e){}applyBg();render()}
// ---- calculations
const mr=d=>[ds(new Date(d.getFullYear(),d.getMonth(),1)),ds(new Date(d.getFullYear(),d.getMonth()+1,0))];
const sum=(ty,a,b)=>P().tx.filter(t=>t.type===ty&&t.date>=a&&t.date<=b).reduce((s,t)=>s+t.amt,0);
function cats(a,b){const o={};P().tx.forEach(t=>{if(t.type==='ex'&&t.date>=a&&t.date<=b)o[t.cat]=(o[t.cat]||0)+t.amt});return Object.entries(o).sort((x,y)=>y[1]-x[1])}
function accEx(a,b){const o={};P().tx.forEach(t=>{if(t.type==='ex'&&t.date>=a&&t.date<=b)o[t.acc]=(o[t.acc]||0)+t.amt});return o}
function bal(a){let b=+a.s||0;P().tx.forEach(t=>{if(t.type==='in'&&t.acc===a.id)b+=t.amt;if(t.type==='ex'&&t.acc===a.id)b-=t.amt;if(t.type==='tr'){if(t.acc===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}});return b}
const an=id=>{const a=P().acc.find(x=>x.id===id);return a?a.n:'?'};
function buckets(k,n){const o=[],N=new Date(),y=N.getFullYear(),m=N.getMonth(),d=N.getDate();for(let i=n-1;i>=0;i--){let a,b,l;
if(k==='d'){a=b=new Date(y,m,d-i);l=a.getDate()+'/'+(a.getMonth()+1)}
else if(k==='w'){b=new Date(y,m,d-7*i);a=new Date(y,m,d-7*i-6);l=a.getDate()+'/'+(a.getMonth()+1)}
else if(k==='m'){a=new Date(y,m-i,1);b=new Date(y,m-i+1,0);l=a.toLocaleString('en',{month:'short'})}
else{a=new Date(y-i,0,1);b=new Date(y-i,11,31);l=''+a.getFullYear()}
const x=ds(a),z=ds(b);o.push({l,i:sum('in',x,z),e:sum('ex',x,z)})}return o}
function range(k){const N=new Date(),t=ds(N);if(k==='d')return[t,t];if(k==='w')return[ds(new Date(N.getFullYear(),N.getMonth(),N.getDate()-6)),t];if(k==='m')return mr(N);return[N.getFullYear()+'-01-01',N.getFullYear()+'-12-31']}
// ---- chart helpers
function bars(B,two){const mx=Math.max(1,...B.map(b=>Math.max(b.e,two?b.i:0)));return`<div class="bars">${B.map(b=>`<div class="bc" onclick="toast('${esc(b.l)}: ${two?'Income '+f(b.i)+' · ':''}Expense ${f(b.e)}')"><div class="bb">${two?`<i style="height:${b.i/mx*100}%;background:var(--in)"></i>`:''}<i style="height:${b.e/mx*100}%;background:var(--ex)"></i></div><span>${esc(b.l)}</span></div>`).join('')}</div>`}
function line(B){const v=B.map(b=>b.i-b.e),mx=Math.max(1,...v.map(Math.abs)),W=300,H=100,st=W/Math.max(1,v.length-1),y=x=>H/2-x/mx*(H/2-8);
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--bd)" stroke-dasharray="4"/><polyline fill="none" stroke="var(--sv)" stroke-width="2.5" points="${v.map((x,i)=>i*st+','+y(x)).join(' ')}"/>${v.map((x,i)=>`<circle cx="${i*st}" cy="${y(x)}" r="3.5" fill="${x<0?'var(--ex)':'var(--in)'}"/>`).join('')}</svg><div style="display:flex;justify-content:space-between">${B.map(b=>`<small style="font-size:10px">${esc(b.l)}</small>`).join('')}</div>`}
function donut(L,tot){const C=2*Math.PI*40;let o=0;return`<svg viewBox="0 0 100 100" width="150" height="150" style="flex:none"><g transform="rotate(-90 50 50)" fill="none" stroke-width="16">${L.map(([c,v],i)=>{const l=v/tot*C,s=`<circle cx="50" cy="50" r="40" stroke="${COL[i%COL.length]}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</g><text x="50" y="49" text-anchor="middle" fill="var(--tx)" font-size="9" font-weight="700">${f(tot)}</text><text x="50" y="60" text-anchor="middle" fill="var(--mu)" font-size="6">Total</text></svg>`}
function catList(L,tot){return L.map(([c,v],i)=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><span><i class="dot" style="background:${COL[i%COL.length]}"></i>${esc(c)}</span><span>${f(v)} <small>${Math.round(v/tot*100)}%</small></span></div><div class="bar"><i style="width:${v/tot*100}%;background:${COL[i%COL.length]}"></i></div></div>`).join('')}
const avh=(src,e,bg,s)=>src?`<img class="av" style="width:${s}px;height:${s}px" src="${src}" alt="">`:`<span class="av" style="width:${s}px;height:${s}px;background:${bg&&bg!=='theme'&&bg!=='#ede9fe'?bg:'var(--c2)'};font-size:${s*.55}px">${e}</span>`;
const avp=(p,s)=>avh(IMG['pic:'+p.id],p.av,p.bg,s);
const dl=d=>{const t=new Date(),y=new Date();y.setDate(t.getDate()-1);return d===ds(t)?'Today':d===ds(y)?'Yesterday':new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
function row(t){const tr=t.type==='tr';return`<div class="tr"><div class="ic">${emo(t)}</div><div class="mid"><b>${esc(tr?'Transfer':t.cat)}</b><small>${esc(an(t.acc))}${tr?' → '+esc(an(t.to)):''} · ${t.time}${t.note?' · '+esc(t.note):''}</small></div><div class="am ${t.type}">${t.type==='in'?'+':t.type==='ex'?'−':''}${f(t.amt)}</div><button class="mini" onclick="tf('${t.id}')" aria-label="Edit">✎</button><button class="mini" onclick="delTx('${t.id}')" aria-label="Delete">🗑</button></div>`}
function bub(t){const tr=t.type==='tr';return`<div class="bub ${t.type}"><small>${emo(t)} ${esc(tr?'Transfer':t.cat)}</small><b class="am ${t.type}">${t.type==='in'?'+':t.type==='ex'?'−':''}${f(t.amt)}</b><small>${esc(an(t.acc))}${tr?' → '+esc(an(t.to)):''}</small>${t.note?`<div>${esc(t.note)}</div>`:''}<small>${t.time} <button class="mini" onclick="tf('${t.id}')">✎</button><button class="mini" onclick="delTx('${t.id}')">🗑</button></small></div>`}
// ---- views
function go(v){view=v;render()}
function render(){const v={home:vHome,tx:vTx,an:vAn,pf:vPf,more:vMore}[view]();$('#app').innerHTML=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));if(view==='tx')drawTx();document.documentElement.dataset.t=S.th}

open(`<h3>Notifications</h3><p>Permission status: <b>${st}</b></p>${st==='granted'?'':`<button class="btn" onclick="askPerm()">Enable notifications</button>`}<button class="btn ghost" onclick="testN()">Send test notification</button>
${tg('tx','New transaction alerts')}${tg('daily','Daily expense reminder')}<div class="tg"><span>Reminder time</span><input type="time" style="width:130px" value="${n.dailyT}" onchange="S.n.dailyT=this.value||'21:00';save()"></div>${tg('budget','Monthly budget reminders (80%)')}${tg('over','Overspending alerts')}${tg('cat','Category budget alerts')}
<p class="note">Alerts go to your phone's notification bar like other apps, not inside the page. On Android this needs the app hosted on https and installed (Add to Home screen) together with the included sw.js; a plain local .html file or an in-app viewer cannot show them. Honest limits: notifications are delivered while this page is open or still in memory in your browser. Android Chrome may block the basic Notification API unless the page is installed as a PWA from a secure (https) address, and truly closed-app alerts need a push server, which this offline file does not include. Missed reminders fire the next time you open the app.</p><button class="btn ghost" onclick="shut()">Close</button>`)}
function askPerm(){if(!('Notification'in window)){toast('Notifications not supported in this browser');return}Notification.requestPermission().then(r=>{toast('Permission: '+r);notifForm()}).catch(()=>toast('Browser blocked the permission prompt here'))}
function remForm(){open(`<h3>Reminders</h3>${S.rem.map(r=>`<div class="row"><div class="mid"><b>${esc(r.title)}</b><small>${r.date} ${r.time} · ${r.rep==='custom'?'every '+r.n+' days':r.rep}</small></div><input type="checkbox" ${r.on?'checked':''} onchange="remTog('${r.id}',this.checked)"><button class="mini" onclick="remEdit('${r.id}')">✎</button><button class="mini" onclick="remDel('${r.id}')">🗑</button></div>`).join('')||'<div class="empty">No reminders</div>'}<button class="btn" onclick="remEdit(null)">+ New reminder</button>`)}
function remTog(id,v){const r=S.rem.find(x=>x.id===id);r.on=v?1:0;save()}
function remDel(id){if(!confirm('Delete reminder?'))return;S.rem=S.rem.filter(r=>r.id!==id);save();remForm()}
function remEdit(id){const N=new Date(),r=id?S.rem.find(x=>x.id===id):{title:'',desc:'',date:ds(N),time:tm(N),rep:'once',n:2,on:1};
open(`<h3>${id?'Edit':'New'} reminder</h3><label>Title</label><input id="rt" maxlength="60" value="${esc(r.title)}"><label>Description</label><textarea id="rd" rows="2" maxlength="200">${esc(r.desc)}</textarea><div class="two"><div><label>Date</label><input id="rdt" type="date" value="${r.date}" onclick="try{this.showPicker()}catch(e){}"></div><div><label>Time</label><input id="rtm" type="time" value="${r.time}" onclick="try{this.showPicker()}catch(e){}"></div></div>
<label>Repeat</label><select id="rr" onchange="$('#rn').style.display=this.value==='custom'?'block':'none'">${['once','daily','weekly','monthly','custom'].map(x=>`<option ${x===r.rep?'selected':''}>${x}</option>`).join('')}</select><input id="rn" type="number" min="1" max="365" value="${r.n||2}" placeholder="Every N days" style="display:${r.rep==='custom'?'block':'none'}">
<div class="tg"><span>Enabled</span><input id="ro" type="checkbox" ${r.on?'checked':''}></div><button class="btn" onclick="remSave('${id||''}')">Save</button><button class="btn ghost" onclick="remForm()">Back</button>`)}
function remSave(id){const title=$('#rt').value.trim(),date=$('#rdt').value,time=$('#rtm').value;if(!title){toast('Enter a title');return}if(!date||!time){toast('Choose date and time');return}
const r={id:id||uid(),title,desc:$('#rd').value.trim(),date,time,rep:$('#rr').value,n:Math.max(1,Math.min(365,parseInt($('#rn').value)||1)),on:$('#ro').checked?1:0};if(id)S.rem[S.rem.findIndex(x=>x.id===id)]=r;else S.rem.push(r);save();remForm();tick()}
function tick(){return;const N=new Date(),t=ds(N);let ch=0;
S.rem.forEach(r=>{if(!r.on)return;let d=new Date(r.date+'T'+r.time+':00');if(isNaN(d)||d>N)return;ntf('⏰ '+r.title,r.desc||'Reminder due');ch=1;if(r.rep==='once'){r.on=0;return}
let g=0;while(d<=N&&g++<800){if(r.rep==='daily')d.setDate(d.getDate()+1);else if(r.rep==='weekly')d.setDate(d.getDate()+7);else if(r.rep==='monthly')d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+Math.max(1,r.n||1))}r.date=ds(d);r.time=tm(d)});
if(S.n.daily&&S.n.lastDaily!==t&&tm(N)>=S.n.dailyT){S.n.lastDaily=t;ch=1;ntf('Daily expense reminder',"Today's Expense: "+f(sum('ex',t,t))+'. Add today\'s entries.')}
const p=P(),[a,b]=mr(N);if(S.n.budget&&p.lim&&S.n.lastBud!==t&&sum('ex',a,b)>=p.lim*.8){S.n.lastBud=t;ch=1;ntf('Monthly budget','You have used '+Math.round(sum('ex',a,b)/p.lim*100)+'% of your budget')}
if(ch){save();if(view==='more'||view==='home')render()}}
const MAILTO='deepdebofficial2003@gmail.com';
function drawer(o){$('#dr').classList.toggle('on',!!o)}
function menu(fn){drawer(0);setTimeout(fn,230)}
function mailTo(sub,body){const a=document.createElement('a');a.href='mailto:'+MAILTO+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);document.body.appendChild(a);a.click();a.remove()}
function copyMail(){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(MAILTO):Promise.reject()).then(()=>toast('Email address copied'),()=>toast(MAILTO))}
function privForm(){open(`<h3>🔒 Privacy Policy</h3><p class="note" style="margin-top:0">Last updated: 27 November 2026</p>
<p><b>What this app is</b><br>Paisa Manager is a personal income and expense tracker that works on your device.</p>
<p><b>What is stored</b><br>Your transactions, accounts, categories, budgets, profile names, profile photos, banners, background image and settings. All of it is saved only on your own device, in your browser's storage.</p>
<p><b>What is not collected</b><br>There is no sign-up or login. There are no ads, no analytics, no tracking and no servers. Your financial data is not uploaded or shared with anyone, including the developer.</p>
<p><b>Photos</b><br>The app reads a photo only when you choose one yourself. It does not use your camera, location or contacts.</p>
<p><b>Backups</b><br>A backup file is created only when you ask for it and is saved on your device. Anyone who has that file can read your data, so keep it safe.</p>
<p><b>Contact and rating</b><br>These open a draft in your email app, addressed to ${MAILTO}. Nothing is sent until you press Send. If you send it, the developer receives the message you wrote and your email address.</p>
<p><b>Deleting your data</b><br>Delete a profile in the app to remove its data, or clear this site's data in your browser settings to remove everything.</p>
<p><b>Changes</b><br>If this policy changes, the new version will appear here.</p>
<p><b>Questions</b><br>${MAILTO}</p><button class="btn ghost" onclick="shut()">Close</button>`)}
function contactForm(){open(`<h3>✉️ Contact us</h3><p class="note" style="margin-top:0">Your message opens as an email draft to <b>${MAILTO}</b>. Press Send in your email app to deliver it.</p><label>Your name (optional)</label><input id="cn" maxlength="40"><label>Message</label><textarea id="cm" rows="5" maxlength="1500" placeholder="Write your message…"></textarea><button class="btn" onclick="contactSend()">Send message</button><button class="btn ghost" onclick="copyMail()">Copy email address</button><button class="btn ghost" onclick="shut()">Close</button>`)}
function contactSend(){const m=$('#cm').value.trim();if(!m){toast('Write a message first');return}const n=$('#cn').value.trim();mailTo('Paisa Manager - message',m+(n?'\n\n- '+n:'')+'\n\n(Sent from the Paisa Manager app)');toast('Email app opened. Tap Send there.')}
let RT={n:0};
function rateForm(){RT={n:(S.rate&&S.rate.n)||0};drawRate()}
function drawRate(){const L=['Tap a star','Poor','Fair','Good','Very good','Excellent'],c=($('#rc')||{}).value||'';
open(`<h3>⭐ Rate Paisa Manager</h3><p class="note" style="margin-top:0">Choose 1 to 5 stars. Your rating is saved on this device and sent to the developer by email.</p><div style="display:flex;justify-content:center;gap:6px;margin:14px 0 4px">${[1,2,3,4,5].map(i=>`<button style="border:0;background:none;font-size:44px;line-height:1;color:${i<=RT.n?'#fbbf24':'var(--mu)'}" onclick="RT.n=${i};drawRate()" aria-label="${i} star">${i<=RT.n?'★':'☆'}</button>`).join('')}</div><div style="text-align:center;min-height:22px"><b>${L[RT.n]}</b></div><label>Comment (optional)</label><textarea id="rc" rows="3" maxlength="800"></textarea><button class="btn" onclick="rateSend()">Submit rating</button><button class="btn ghost" onclick="shut()">Close</button>`);if(c)$('#rc').value=c}
function rateSend(){if(!RT.n){toast('Tap a star first');return}const c=$('#rc').value.trim();S.rate={n:RT.n,ts:Date.now()};save();mailTo('Paisa Manager rating: '+RT.n+'/5','Rating: '+'★'.repeat(RT.n)+'☆'.repeat(5-RT.n)+' ('+RT.n+'/5)'+(c?'\n\nComment: '+c:'')+'\n\n(Sent from the Paisa Manager app)');toast('Thanks! Tap Send in your email app.')}
load();document.documentElement.dataset.t=S.th;render();loadImgs();applyBg();
</script></body></html>
